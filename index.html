<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPiscis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link
        rel="shortcut icon"
        href="/img/img.ico"
        type="image/x-icon"
    />
    <style>

            font-family: 'Inter', sans-serif;

              background-position: center;
              background-repeat: no-repeat;
              background-attachment: fixed;

        }

            background-color: #d4edda;
            color: #155724;

            margin-bottom: 1rem;
        }
        .alerta-amarelo {
            background-color: #fff3cd;

            background-color: #f8d7da;

<body class="p-4">
    <div class="container max-w-2xl mx-auto p-8 bg-black bg-opacity-80 rounded-xl shadow-lg box-border text-gray-100">
        <h2 class="text-center text-teal-400 text-3xl font-bold mb-6 mt-2">
            <img src="/img/img-logo.png" alt="SmartPiscis Logo" class="inline-block align-middle mr-2 rounded-full" width="70" height="70">
            SmartPiscis 🐟
        </h2>


        <label for="tipoCalculadora" class="block mt-4 mb-2 font-semibold text-gray-200">Tipo de Calculadora:</label>
        <select id="tipoCalculadora" onchange="alternarCalculadora()"
            class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
            <option value="estrutura">Dimensionamento do Viveiro</option>
            <option value="agua">Análise da Água</option>
            <option value="racao">Ração</option>
        </select>

        <div id="formEstrutura">
            <label for="comprimento" class="block mt-2 mb-2 font-semibold text-gray-200">Comprimento (m):</label>
            <input type="number" id="comprimento" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="largura" class="block mb-2 font-semibold text-gray-200">Largura (m):</label>
            <input type="number" id="largura" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="profundidade" class="block mb-2 font-semibold text-gray-200">Profundidade média (m):</label>
            <input type="number" id="profundidade" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="densidade" class="block mb-2 font-semibold text-gray-200">Densidade (peixes/m³ - opcional para cálculo inicial):</label>
            <input type="number" id="densidade" min="0" step="0.01" placeholder="Deixe em branco para sugestão"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="tipoTanque" class="block mb-2 font-semibold text-gray-200">Tipo de Tanque:</label>
            <select id="tipoTanque"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="escavado">Tanque Escavado</option>
                <option value="rede">Tanque-Rede</option>
                <option value="ras">Sistema RAS</option>
            </select>

            <label for="especieEstrutura" class="block mb-2 font-semibold text-gray-200">Espécie de Peixe:</label>
            <select id="especieEstrutura"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="matrinxa">Matrinxã</option>
                <option value="tambaqui">Tambaqui</option>
                <option value="pirarucu">Pirarucu</option>
            </select>

            <label for="faseEstrutura" class="block mb-2 font-semibold text-gray-200">Fase de Criação:</label>
            <select id="faseEstrutura"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="alevinagem">Alevinagem</option>
                <option value="recria">Recria</option>
                <option value="engorda">Engorda</option>
            </select>

            <label for="pesoMedioEstrutura" class="block mb-2 font-semibold text-gray-200">Peso médio dos peixes na hora da venda (kg):</label>
            <input type="number" id="pesoMedioEstrutura" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <button onclick="calcularEstrutura()"
                class="btn-calcular w-full p-3 mt-4 bg-teal-700 text-white font-bold rounded-lg hover:bg-teal-800 transition duration-300 ease-in-out shadow-md">
                Calcular Dimensionamento
            </button>
        </div>

        <div id="formAgua" style="display:none;">
            <label for="especieAgua" class="block mt-2 mb-2 font-semibold text-gray-200">Espécie de Peixe:</label>
            <select id="especieAgua"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="matrinxa">Matrinxã</option>
                <option value="tambaqui">Tambaqui</option>
                <option value="pirarucu">Pirarucu</option>
            </select>

            <label for="temperatura" class="block mb-2 font-semibold text-gray-200">Temperatura da Água (°C):</label>
            <input type="number" id="temperatura" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="ph" class="block mb-2 font-semibold text-gray-200">pH da Água:</label>
            <input type="number" id="ph" min="0" step="0.01"

            <label for="oxigenio" class="block mb-2 font-semibold text-gray-200">Oxigênio Dissolvido (mg/L):</label>
            <input type="number" id="oxigenio" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="alcalinidade" class="block mb-2 font-semibold text-gray-200">Alcalinidade Total (mg/L CaCO₃):</label>
            <input type="number" id="alcalinidade" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="amonia" class="block mb-2 font-semibold text-gray-200">Amônia Total (mg/L):</label>
            <input type="number" id="amonia" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="nitrito" class="block mb-2 font-semibold text-gray-200">Nitrito (mg/L):</label>
            <input type="number" id="nitrito" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="nitrato" class="block mb-2 font-semibold text-gray-200">Nitrato (mg/L):</label>
            <input type="number" id="nitrato" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="transparencia" class="block mb-2 font-semibold text-gray-200">Transparência da Água (cm - Disco de Secchi):</label>
            <input type="number" id="transparencia" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <button onclick="analisarAgua()"
                class="btn-calcular w-full p-3 mt-4 bg-teal-700 text-white font-bold rounded-lg hover:bg-teal-800 transition duration-300 ease-in-out shadow-md">
                Analisar Água
            </button>
        </div>

        <div id="formRacao" style="display:none;">
            <label for="especieRacao" class="block mt-2 mb-2 font-semibold text-gray-200">Espécie de Peixe:</label>
            <select id="especieRacao"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="matrinxa">Matrinxã</option>
                <option value="tambaqui">Tambaqui</option>
                <option value="pirarucu">Pirarucu</option>
            </select>

            <label for="faseRacao" class="block mb-2 font-semibold text-gray-200">Fase de Criação:</label>
            <select id="faseRacao"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="alevinagem">Alevinagem</option>
                <option value="recria">Recria</option>
                <option value="engorda">Engorda</option>
            </select>

            <label for="pesoMedioRacao" class="block mb-2 font-semibold text-gray-200">Peso médio dos peixes (g):</label>
            <input type="number" id="pesoMedioRacao" min="0" step="0.01"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="quantidadePeixes" class="block mb-2 font-semibold text-gray-200">Quantidade de Peixes:</label>
            <input type="number" id="quantidadePeixes" min="0" step="1"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <button onclick="calcularRacao()"
                class="btn-calcular w-full p-3 mt-4 bg-teal-700 text-white font-bold rounded-lg hover:bg-teal-800 transition duration-300 ease-in-out shadow-md">
                Calcular Ração
            </button>
        </div>

        <div id="resultado" class="mt-6 p-4 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 text-base">
            </div>

        <div class="social flex flex-col sm:flex-row gap-4 justify-between mt-6">
            <button onclick="compartilharWhatsApp()"

            document.getElementById("formAgua").style.display = tipo === "agua" ? "block" : "none";
            document.getElementById("formRacao").style.display = tipo === "racao" ? "block" : "none";

        }

        // Função para calcular o dimensionamento do viveiro
        function calcularEstrutura() {
            const comprimento = parseFloat(document.getElementById("comprimento").value);
            const largura = parseFloat(document.getElementById("largura").value);
            const profundidade = parseFloat(document.getElementById("profundidade").value);
            let densidadeInput = parseFloat(document.getElementById("densidade").value); // Pode ser opcional
            const tipoTanque = document.getElementById("tipoTanque").value;
            const especie = document.getElementById("especieEstrutura").value;
            const fase = document.getElementById("faseEstrutura").value;
            const pesoMedioVenda = parseFloat(document.getElementById("pesoMedioEstrutura").value);

            // Validação de campos obrigatórios
            if (isNaN(comprimento) || isNaN(largura) || isNaN(profundidade) || isNaN(pesoMedioVenda)) {
                return exibirErro("Por favor, preencha Comprimento, Largura, Profundidade e Peso médio de venda.");
            }
            if (comprimento <= 0 || largura <= 0 || profundidade <= 0 || pesoMedioVenda <= 0) {
                return exibirErro("Os valores de comprimento, largura, profundidade e peso médio de venda devem ser maiores que zero.");
            }

            const volume = comprimento * largura * profundidade;
            let quantidadePeixes = 0;
            let densidadeRecomendada = 0;
            let recomendacoes = "";

            // Obter densidade recomendada
            if (dadosPiscicultura.densidadeEstocagem[tipoTanque] && dadosPiscicultura.densidadeEstocagem[tipoTanque][fase] && dadosPiscicultura.densidadeEstocagem[tipoTanque][fase][especie]) {
                densidadeRecomendada = dadosPiscicultura.densidadeEstocagem[tipoTanque][fase][especie];
            } else {
                recomendacoes += `<div class="alerta-amarelo">Não foi possível encontrar uma densidade de estocagem recomendada para a combinação de tipo de tanque, fase e espécie.</div>`;
            }

            // Se a densidade foi fornecida pelo usuário, usá-la; caso contrário, usar a recomendada
            const densidadeUsada = isNaN(densidadeInput) || densidadeInput <= 0 ? densidadeRecomendada : densidadeInput;

            if (densidadeUsada > 0) {
                quantidadePeixes = volume * densidadeUsada;
            } else {
                return exibirErro("Não foi possível determinar a densidade de estocagem. Por favor, insira uma densidade ou selecione uma combinação válida de tipo de tanque, fase e espécie.");
            }

            const biomassaEstimadaVenda = quantidadePeixes * pesoMedioVenda;

            let statusDensidade = "";
            if (!isNaN(densidadeInput) && densidadeInput > 0) {
                if (densidadeInput > densidadeRecomendada * 1.2) {
                    statusDensidade = `<span class="text-red-400 font-bold">Muito Alta</span>`;
                    recomendacoes += `<div class="alerta-vermelho">Sua densidade (${densidadeInput} peixes/m³) está muito acima da recomendada (${densidadeRecomendada} peixes/m³). Isso pode levar a estresse, doenças e baixo crescimento. Considere reduzir a quantidade de peixes ou aumentar o volume.</div>`;
                } else if (densidadeInput < densidadeRecomendada * 0.8) {
                    statusDensidade = `<span class="text-yellow-400 font-bold">Baixa</span>`;
                    recomendacoes += `<div class="alerta-amarelo">Sua densidade (${densidadeInput} peixes/m³) está abaixo da recomendada (${densidadeRecomendada} peixes/m³). Você pode estar subutilizando seu espaço. Considere aumentar a quantidade de peixes para otimizar a produção.</div>`;
                } else {
                    statusDensidade = `<span class="text-green-400 font-bold">Ideal</span>`;
                    recomendacoes += `<div class="alerta-verde">Sua densidade (${densidadeInput} peixes/m³) está na faixa ideal. Bom trabalho!</div>`;
                }
            } else {
                statusDensidade = `<span class="text-blue-400 font-bold">Recomendada</span>`;
                recomendacoes += `<div class="alerta-info">Utilizamos a densidade recomendada de ${densidadeRecomendada} peixes/m³ para ${especie} na fase de ${fase} em ${tipoTanque}.</div>`;
            }

            // Recomendações gerais por tipo de tanque
            let recomendacoesTanque = "";
            switch (tipoTanque) {
                case 'escavado':
                    recomendacoesTanque = `
                        <p class="mt-2"><strong>Recomendações para Tanque Escavado:</strong></p>
                        <ul class="list-disc list-inside ml-4">
                            <li>Mantenha a qualidade da água monitorando parâmetros regularmente.</li>
                            <li>Considere aeração suplementar em altas densidades ou períodos de baixa oxigenação.</li>
                            <li>Realize a manutenção do fundo do tanque e controle de plantas aquáticas.</li>
                            <li>Proteja contra predadores (aves, mamíferos).</li>
                        </ul>
                    `;
                    break;
                case 'rede':
                    recomendacoesTanque = `
                        <p class="mt-2"><strong>Recomendações para Tanque-Rede:</strong></p>
                        <ul class="list-disc list-inside ml-4">
                            <li>Verifique a integridade das redes regularmente para evitar fugas e entrada de predadores.</li>
                            <li>Limpe as redes para evitar entupimento e garantir o fluxo de água.</li>
                            <li>Monitore a correnteza e a profundidade da água no local de instalação.</li>
                            <li>Evite sobrecarga de ração para não comprometer a qualidade da água ao redor dos tanques.</li>
                        </ul>
                    `;
                    break;
                case 'ras':
                    recomendacoesTanque = `
                        <p class="mt-2"><strong>Recomendações para Sistema RAS:</strong></p>
                        <ul class="list-disc list-inside ml-4">
                            <li>A manutenção rigorosa dos filtros biológicos e mecânicos é importante.</li>
                            <li>Monitore constantemente os níveis de oxigênio, amônia, nitrito e nitrato.</li>
                            <li>Garanta um bom sistema de aeração e oxigenação.</li>
                            <li>Para caso de falta de energia tenha um gerador .</li>
                             <li>Tenha areadores e bombas resevas.</li>
                        </ul>
                    `;
                    break;
            }

            // Recomendação de peso de abate
            const pesoAbateIdeal = dadosPiscicultura.pesoAbateIdeal[especie];
            let recomendacaoPesoAbate = "";
            if (pesoMedioVenda < pesoAbateIdeal * 0.9) {
                recomendacaoPesoAbate = `<div class="alerta-amarelo">Seu peso médio de venda (${pesoMedioVenda.toFixed(2)} kg) está abaixo do ideal para ${especie} (${pesoAbateIdeal.toFixed(2)} kg). Considerar estender o período de engorda para otimizar o retorno.</div>`;
            } else if (pesoMedioVenda > pesoAbateIdeal * 1.1) {
                recomendacaoPesoAbate = `<div class="alerta-info">Seu peso médio de venda (${pesoMedioVenda.toFixed(2)} kg) está acima do ideal para ${especie} (${pesoAbateIdeal.toFixed(2)} kg). Excelente! Isso pode indicar um bom manejo e condições favoráveis.</div>`;
            } else {
                recomendacaoPesoAbate = `<div class="alerta-verde">Seu peso médio de venda (${pesoMedioVenda.toFixed(2)} kg) está na faixa ideal para ${especie} (${pesoAbateIdeal.toFixed(2)} kg).</div>`;
            }


            document.getElementById("resultado").innerHTML = `
                <h3 class="text-xl font-bold text-teal-300 mb-4">📊 Resultado do Dimensionamento do Viveiro</h3>
                <p><strong>Volume do tanque:</strong> ${volume.toFixed(2)} m³</p>
                <p><strong>Densidade de estocagem utilizada:</strong> ${densidadeUsada.toFixed(2)} peixes/m³ (${statusDensidade})</p>
                <p><strong>Quantidade estimada de peixes:</strong> ${quantidadePeixes.toFixed(0)} peixes</p>
                <p><strong>Biomassa estimada na venda:</strong> ${biomassaEstimadaVenda.toFixed(2)} kg</p>
                <br>
                <h4 class="text-lg font-semibold text-teal-300 mb-2">Recomendações:</h4>
                ${recomendacaoPesoAbate}
                ${recomendacoes}
                ${recomendacoesTanque}
            `;
        }

        // Função para analisar a qualidade da água
        function analisarAgua() {
            const especie = document.getElementById("especieAgua").value;
            const temperatura = parseFloat(document.getElementById("temperatura").value);
            const ph = parseFloat(document.getElementById("ph").value);
            const oxigenio = parseFloat(document.getElementById("oxigenio").value);
            const alcalinidade = parseFloat(document.getElementById("alcalinidade").value);
            const amonia = parseFloat(document.getElementById("amonia").value);
            const nitrito = parseFloat(document.getElementById("nitrito").value);
            const nitrato = parseFloat(document.getElementById("nitrato").value);
            const transparencia = parseFloat(document.getElementById("transparencia").value);

            // Validação de campos obrigatórios
            if (
                isNaN(temperatura) || isNaN(ph) || isNaN(oxigenio) ||
                isNaN(alcalinidade) || isNaN(amonia) || isNaN(nitrito) ||
                isNaN(nitrato) || isNaN(transparencia)
            ) {
                return exibirErro("Por favor, preencha todos os campos da análise da água.");
            }

            const faixa = dadosPiscicultura.limitesAgua[especie];
            if (!faixa) return exibirErro("Espécie inválida para análise de água.");

            let resultadoHtml = `<h3 class="text-xl font-bold text-teal-300 mb-4">🔍 Análise da Água para ${faixa.nome}</h3>`;
            let statusGeral = "Excelente"; // Assume excelente, rebaixa se houver problemas
            let problemasEncontrados = 0;

            // Função auxiliar para verificar e formatar cada parâmetro
            function verificarParametro(parametroNome, valor, dadosParametro) {
                const [min, max] = dadosParametro.range;
                const unidade = dadosParametro.unit;
                let dentro = false;
                let comentario = "";
                let classeAlerta = "alerta-verde"; // Padrão para ideal

                if (parametroNome === "Amônia" || parametroNome === "Nitrito" || parametroNome === "Nitrato") {
                    // Para amônia, nitrito, nitrato, o valor deve ser ABAIXO do máximo
                    dentro = valor <= max;
                    if (!dentro) {
                        comentario = `Atenção! Valor acima do recomendado (${max} ${unidade}).<br><strong>Sugestão:</strong> ${dadosParametro.highRec}`;
                        classeAlerta = "alerta-vermelho";
                        problemasEncontrados++;
                        if (statusGeral === "Excelente") statusGeral = "Atenção";
                    } else {
                        comentario = "Dentro do ideal.";
                    }
                } else {
                    // Para outros parâmetros, o valor deve estar DENTRO da faixa
                    dentro = valor >= min && valor <= max;
                    if (!dentro) {
                        if (valor < min) {
                            comentario = `Atenção! Valor abaixo do recomendado (${min} a ${max} ${unidade}).<br><strong>Sugestão:</strong> ${dadosParametro.lowRec}`;
                        } else { // valor > max
                            comentario = `Atenção! Valor acima do recomendado (${min} a ${max} ${unidade}).<br><strong>Sugestão:</strong> ${dadosParametro.highRec}`;
                        }
                        classeAlerta = "alerta-amarelo";
                        problemasEncontrados++;
                        if (statusGeral === "Excelente") statusGeral = "Atenção";
                    } else {
                        comentario = "Dentro do ideal.";
                    }
                }

                if (classeAlerta === "alerta-vermelho") {
                    statusGeral = "Crítico";
                } else if (classeAlerta === "alerta-amarelo" && statusGeral !== "Crítico") {
                    statusGeral = "Atenção";
                }

                const icone = dentro ? "✅" : "❌";
                return `<div class="${classeAlerta} mb-2 p-2 rounded-md">
                            ${icone} <strong>${parametroNome}:</strong> ${valor} ${unidade}<br>
                            <span class="text-sm">${comentario}</span>
                        </div>`;
            }

            resultadoHtml += verificarParametro("Temperatura", temperatura, faixa.temp);
            resultadoHtml += verificarParametro("pH", ph, faixa.ph);
            resultadoHtml += verificarParametro("Oxigênio Dissolvido", oxigenio, faixa.oxi);
            resultadoHtml += verificarParametro("Alcalinidade Total", alcalinidade, faixa.alc);
            resultadoHtml += verificarParametro("Amônia Total", amonia, faixa.amonia);
            resultadoHtml += verificarParametro("Nitrito", nitrito, faixa.nitrito);
            resultadoHtml += verificarParametro("Nitrato", nitrato, faixa.nitrato);
            resultadoHtml += verificarParametro("Transparência", transparencia, faixa.trans);

            let statusGeralMensagem = "";
            switch (statusGeral) {
                case "Excelente":
                    statusGeralMensagem = `<div class="alerta-verde mt-4 text-lg font-bold">Status Geral da Água: ${statusGeral}! Suas condições estão ótimas para o cultivo de ${faixa.nome}. Continue monitorando!</div>`;
                    break;
                case "Atenção":
                    statusGeralMensagem = `<div class="alerta-amarelo mt-4 text-lg font-bold">Status Geral da Água: ${statusGeral}. Alguns parâmetros exigem atenção. Revise as recomendações acima e tome as ações necessárias.</div>`;
                    break;
                case "Crítico":
                    statusGeralMensagem = `<div class="alerta-vermelho mt-4 text-lg font-bold">Status Geral da Água: ${statusGeral}! Condições críticas detectadas. Ações corretivas urgentes são necessárias para evitar perdas de peixes.</div>`;
                    break;
            }

            resultadoHtml += statusGeralMensagem;
            document.getElementById("resultado").innerHTML = resultadoHtml;
        }

        // Função para calcular a ração
        function calcularRacao() {
            const especie = document.getElementById("especieRacao").value;
            const fase = document.getElementById("faseRacao").value;
            const pesoMedioGramas = parseFloat(document.getElementById("pesoMedioRacao").value);
            const quantidadePeixes = parseInt(document.getElementById("quantidadePeixes").value);

            // Validação de campos obrigatórios
            if (isNaN(pesoMedioGramas) || isNaN(quantidadePeixes) || pesoMedioGramas <= 0 || quantidadePeixes <= 0) {
                return exibirErro("Por favor, preencha o Peso médio dos peixes (g) e a Quantidade de Peixes corretamente.");
            }

            const dadosRacao = dadosPiscicultura.racao[especie][fase];
            if (!dadosRacao) {
                return exibirErro("Não foi possível encontrar dados de ração para a espécie e fase selecionadas.");
            }

            let taxaAlimentacao = 0;
            let refeicoes = 0;

            // Encontrar a taxa de alimentação e refeições com base no peso médio
            for (const range of dadosRacao.taxa) {
                const [minPeso, maxPeso, taxa, numRefeicoes] = range;
                if (pesoMedioGramas >= minPeso && pesoMedioGramas <= maxPeso) {
                    taxaAlimentacao = taxa;
                    refeicoes = numRefeicoes;
                    break;
                }
            }

            if (taxaAlimentacao === 0) {
                return exibirErro("Não foi possível determinar a taxa de alimentação para o peso médio informado. Verifique a faixa de peso.");
            }

            const pesoMedioKg = pesoMedioGramas / 1000;
            const biomassa = pesoMedioKg * quantidadePeixes;
            const consumoDiarioKg = biomassa * taxaAlimentacao;
            const porRefeicaoKg = consumoDiarioKg / refeicoes;

            const nivelProteina = dadosRacao.proteina;
            const tamanhoPellet = dadosRacao.pellet;

            let recomendacoesRacao = `
                <p class="mt-2"><strong>Recomendações de Manejo da Ração:</strong></p>
                <ul class="list-disc list-inside ml-4">
                    <li>Observe o comportamento dos peixes durante a alimentação. Se sobrarem ração, reduza a quantidade na próxima refeição.</li>
                    <li>Outra forma de alimentação é por meio da <i>ad libtum</i>, oferecendo alimento à vontade até que o peixe perca o interesse.
                    <li>Distribua a ração de forma uniforme para garantir que todos os peixes tenham acesso sempre com o vento nas suas costas para que a ração não encoste na beira do viveiro.</li>
                    <li>Evite alimentar em excesso, pois isso pode comprometer a qualidade da água.</li>
                    <li>Em dias frios ou com baixa oxigenação, reduza a quantidade de ração ofertada.</li>
                    <li>Armazene a ração em local seco e arejado, protegido de roedores e insetos.</li>
                </ul>
            `;

            document.getElementById("resultado").innerHTML = `
                <h3 class="text-xl font-bold text-teal-300 mb-4">📊 Resultado da Calculadora de Ração</h3>
                <p><strong>Espécie:</strong> ${dadosPiscicultura.limitesAgua[especie].nome}</p>
                <p><strong>Fase de Criação:</strong> ${fase}</p>
                <p><strong>Peso médio dos peixes:</strong> ${pesoMedioGramas.toFixed(2)} g (${pesoMedioKg.toFixed(3)} kg)</p>
                <p><strong>Quantidade de Peixes:</strong> ${quantidadePeixes} peixes</p>
                <p><strong>Biomassa Total:</strong> ${biomassa.toFixed(2)} kg</p>
                <p><strong>Taxa de Alimentação Diária:</strong> ${(taxaAlimentacao * 100).toFixed(1)}% da biomassa</p>
                <p><strong>Nível de Proteína Recomendado:</strong> ${nivelProteina}%</p>
                <p><strong>Número de Refeições/dia:</strong> ${refeicoes}</p>
                <p><strong>Tamanho do Pellet Recomendado:</strong> ${tamanhoPellet}</p>
                <br>
                <p class="text-xl font-bold text-teal-300">🍽️ Ração Diária Total: <span class="text-white">${consumoDiarioKg.toFixed(2)} kg</span></p>
                <p class="text-xl font-bold text-teal-300">Ração por Refeição: <span class="text-white">${porRefeicaoKg.toFixed(2)} kg</span></p>
                <br>
                <h4 class="text-lg font-semibold text-teal-300 mb-2">Recomendações:</h4>
                ${recomendacoesRacao}
            `;
        }

        // Função para compartilhar no WhatsApp
        function compartilharWhatsApp() {
            const resultadoElement = document.getElementById("resultado");
            if (!resultadoElement.innerText.trim()) {
                // Using a custom modal/message box instead of alert()
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50';
                modal.innerHTML = `
                    <div class="bg-gray-800 p-6 rounded-lg shadow-xl text-white max-w-sm mx-auto">
                        <h3 class="text-lg font-bold mb-4">Aviso!</h3>
                        <p>Calcule primeiro para compartilhar o resultado.</p>
                        <button onclick="this.closest('.fixed').remove()" class="mt-4 w-full p-2 bg-teal-600 rounded-md hover:bg-teal-700">OK</button>
                    </div>
                `;
                document.body.appendChild(modal);
                return;
            }

            const textoCompartilhar = `*Resultado da Calculadora de Piscicultura:*\n\n${resultadoElement.innerText}\n\nAcesse a calculadora: ${window.location.href}`;
            const urlWhatsApp = `https://wa.me/?text=${encodeURIComponent(textoCompartilhar)}`;
            window.open(urlWhatsApp, "_blank");
        }

        // Função para baixar o resultado em PDF
        function baixarPDF() {
            const resultadoElement = document.getElementById("resultado");
            if (!resultadoElement.innerText.trim()) {
                // Using a custom modal/message box instead of alert()
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50';
                modal.innerHTML = `
                    <div class="bg-gray-800 p-6 rounded-lg shadow-xl text-white max-w-sm mx-auto">
                        <h3 class="text-lg font-bold mb-4">Aviso!</h3>
                        <p>Calcule primeiro para gerar o PDF.</p>
                        <button onclick="this.closest('.fixed').remove()" class="mt-4 w-full p-2 bg-teal-600 rounded-md hover:bg-teal-700">OK</button>
                    </div>
                `;
                document.body.appendChild(modal);
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(18);
            doc.text("Relatório da Calculadora de Piscicultura", 105, 20, null, null, "center");

            doc.setFontSize(12);
            // Split text to handle line breaks and fit page width
            const textLines = doc.splitTextToSize(resultadoElement.innerText, 180); // Max width 180mm
            doc.text(textLines, 15, 30);

            doc.save("relatorio-piscicultura.pdf");
        }

        // Inicializa a calculadora na primeira opção ao carregar a página
        document.addEventListener('DOMContentLoaded', alternarCalculadora);
    </script>
</body>

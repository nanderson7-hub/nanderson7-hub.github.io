<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPiscis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link
        rel="shortcut icon"
        href="/img/img.ico"
        type="image/x-icon"
    />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('./img/img-fundo.png'); /* Cor de fundo original */

            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .alerta-verde {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .alerta-amarelo {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .alerta-vermelho {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .alerta-info {
            background-color: #d1ecf1;

<body class="p-4">
    <div class="container max-w-2xl mx-auto p-8 bg-black bg-opacity-80 rounded-xl shadow-lg box-border text-gray-100">
        <h2 class="text-center text-teal-400 text-3xl font-bold mb-6 mt-2">
            <img src="/img/img-logo.png" alt="SmartPiscis Logo" class="inline-block align-middle mr-2 rounded-full" width="70" height="70" onerror="this.style.display='none'">
            SmartPiscis 🐟
        </h2>


        <label for="tipoCalculadora" class="block mt-4 mb-2 font-semibold text-gray-200">Tipo de Calculadora:</label>
        <select id="tipoCalculadora" onchange="alternarCalculadora()"
            class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
            <option value="estrutura">Dimensionamento do Viveiro</option>
            <option value="agua">Análise da Água</option>
            <option value="racao">Ração</option>
        </select>

        <div id="formEstrutura">
            <label for="comprimento" class="block mt-2 mb-2 font-semibold text-gray-200">Comprimento (m):</label>
            <input type="text" inputmode="decimal" id="comprimento"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="largura" class="block mb-2 font-semibold text-gray-200">Largura (m):</label>
            <input type="text" inputmode="decimal" id="largura"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="profundidade" class="block mb-2 font-semibold text-gray-200">Profundidade média (m):</label>
            <input type="text" inputmode="decimal" id="profundidade"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="densidade" class="block mb-2 font-semibold text-gray-200">Densidade (peixes/m² - opcional para cálculo inicial):</label>
            <input type="text" inputmode="decimal" id="densidade" placeholder="Deixe em branco para sugestão"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="tipoTanque" class="block mb-2 font-semibold text-gray-200">Tipo de Tanque:</label>
            <select id="tipoTanque"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="escavado">Tanque Escavado</option>
                <option value="rede">Tanque-Rede</option>
                <option value="ras">Sistema RAS</option>
            </select>

            <label for="especieEstrutura" class="block mb-2 font-semibold text-gray-200">Espécie de Peixe:</label>
            <select id="especieEstrutura"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="matrinxa">Matrinxã</option>
                <option value="tambaqui">Tambaqui</option>
                <option value="pirarucu">Pirarucu</option>
            </select>

            <label for="faseEstrutura" class="block mb-2 font-semibold text-gray-200">Fase de Criação:</label>
            <select id="faseEstrutura"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="alevinagem">Alevinagem</option>
                <option value="recria">Recria</option>
                <option value="engorda">Engorda</option>
            </select>

            <label for="pesoMedioEstrutura" class="block mb-2 font-semibold text-gray-200">Peso médio dos peixes na hora da venda (kg):</label>
            <input type="text" inputmode="decimal" id="pesoMedioEstrutura"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <button onclick="calcularEstrutura()"
                class="btn-calcular w-full p-3 mt-4 bg-teal-700 text-white font-bold rounded-lg hover:bg-teal-800 transition duration-300 ease-in-out shadow-md">
                Calcular Dimensionamento
            </button>
        </div>

        <div id="formAgua" style="display:none;">
            <label for="especieAgua" class="block mt-2 mb-2 font-semibold text-gray-200">Espécie de Peixe:</label>
            <select id="especieAgua"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="matrinxa">Matrinxã</option>
                <option value="tambaqui">Tambaqui</option>
                <option value="pirarucu">Pirarucu</option>
            </select>

            <label for="temperatura" class="block mb-2 font-semibold text-gray-200">Temperatura da Água (°C):</label>
            <input type="text" inputmode="decimal" id="temperatura"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="ph" class="block mb-2 font-semibold text-gray-200">pH da Água:</label>
            <input type="text" inputmode="decimal" id="ph"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="oxigenio" class="block mb-2 font-semibold text-gray-200">Oxigênio Dissolvido (mg/L):</label>
            <input type="text" inputmode="decimal" id="oxigenio"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="alcalinidade" class="block mb-2 font-semibold text-gray-200">Alcalinidade Total (mg/L CaCO₃):</label>
            <input type="text" inputmode="decimal" id="alcalinidade"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="amonia" class="block mb-2 font-semibold text-gray-200">Amônia Total (mg/L):</label>
            <input type="text" inputmode="decimal" id="amonia"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="nitrito" class="block mb-2 font-semibold text-gray-200">Nitrito (mg/L):</label>
            <input type="text" inputmode="decimal" id="nitrito"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="nitrato" class="block mb-2 font-semibold text-gray-200">Nitrato (mg/L):</label>
            <input type="text" inputmode="decimal" id="nitrato"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="transparencia" class="block mb-2 font-semibold text-gray-200">Transparência da Água (cm - Disco de Secchi):</label>
            <input type="text" inputmode="decimal" id="transparencia"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <button onclick="analisarAgua()"
                class="btn-calcular w-full p-3 mt-4 bg-teal-700 text-white font-bold rounded-lg hover:bg-teal-800 transition duration-300 ease-in-out shadow-md">
                Analisar Água
            </button>
        </div>

        <div id="formRacao" style="display:none;">
            <label for="especieRacao" class="block mt-2 mb-2 font-semibold text-gray-200">Espécie de Peixe:</label>
            <select id="especieRacao"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="matrinxa">Matrinxã</option>
                <option value="tambaqui">Tambaqui</option>
                <option value="pirarucu">Pirarucu</option>
            </select>

            <label for="faseRacao" class="block mb-2 font-semibold text-gray-200">Fase de Criação:</label>
            <select id="faseRacao"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="alevinagem">Alevinagem</option>
                <option value="recria">Recria</option>
                <option value="engorda">Engorda</option>
            </select>

            <label for="pesoMedioRacao" class="block mb-2 font-semibold text-gray-200">Peso médio dos peixes (g):</label>
            <input type="text" inputmode="decimal" id="pesoMedioRacao"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="quantidadePeixes" class="block mb-2 font-semibold text-gray-200">Quantidade de Peixes:</label>
            <input type="number" id="quantidadePeixes" min="0" step="1"
                class="w-full p-3 mb-4 border border-gray-700 rounded-lg bg-gray-800 text-gray-100 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">

            <button onclick="calcularRacao()"
                class="btn-calcular w-full p-3 mt-4 bg-teal-700 text-white font-bold rounded-lg hover:bg-teal-800 transition duration-300 ease-in-out shadow-md">
                Calcular Ração
            </button>
        </div>

        <div id="resultado" class="mt-6 p-4 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 text-base">
        </div>

        <div class="social flex flex-col sm:flex-row gap-4 justify-between mt-6">
            <button onclick="compartilharWhatsApp()"
                class="btn-whatsapp flex-1 p-3 bg-green-500 text-white font-bold rounded-lg hover:bg-green-600 transition duration-300 ease-in-out shadow-md">
                Compartilhar no WhatsApp
            </button>
            <button onclick="baixarPDF()"
                class="btn-pdf flex-1 p-3 bg-teal-800 text-white font-bold rounded-lg hover:bg-teal-900 transition duration-300 ease-in-out shadow-md">
                Baixar resultado em PDF
            </button>
        </div>

        <div class="rodape text-center mt-6 text-gray-400 text-xs">
            <p>Criado por Nanderson Silva</p>
            <p>Contato:nandersonsilva7@gmail.com</p>
        </div>
    </div>

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tipoTanque').addEventListener('change', atualizarLabelDensidade);
            atualizarLabelDensidade();
        });

        // --- FUNÇÕES GERAIS ---
        function alternarCalculadora() {
            const tipo = document.getElementById("tipoCalculadora").value;
            document.getElementById("formEstrutura").style.display = tipo === "estrutura" ? "block" : "none";
            document.getElementById("formAgua").style.display = tipo === "agua" ? "block" : "none";
            document.getElementById("formRacao").style.display = tipo === "racao" ? "block" : "none";
            document.getElementById("resultado").innerHTML = ""; // Limpa o resultado ao trocar
        }

        function exibirErro(mensagem) {
            document.getElementById("resultado").innerHTML = `<div class="alerta-vermelho"><strong>Erro:</strong> ${mensagem}</div>`;
        }

        function formatarNumeroBR(numero, casasDecimais = 2) {
            if (isNaN(numero)) return numero;
            return numero.toLocaleString('pt-BR', {
                minimumFractionDigits: casasDecimais,
                maximumFractionDigits: casasDecimais
            });
        }
        
        function parseLocalFloat(str) {
            if (!str) return NaN;
            return parseFloat(str.replace(',', '.'));
        }

        function atualizarLabelDensidade() {
            const tipoTanque = document.getElementById("tipoTanque").value;
            const densidadeLabel = document.querySelector('label[for="densidade"]');
            
            if (tipoTanque === 'escavado') {
                densidadeLabel.innerHTML = 'Densidade (peixes/m² - opcional para cálculo inicial):';
            } else {
                densidadeLabel.innerHTML = 'Densidade (peixes/m³ - opcional para cálculo inicial):';
            }
        }

        // --- CÁLCULO DE ESTRUTURA ---
        function calcularEstrutura() {
            const comprimento = parseLocalFloat(document.getElementById("comprimento").value);
            const largura = parseLocalFloat(document.getElementById("largura").value);
            const profundidade = parseLocalFloat(document.getElementById("profundidade").value);
            let densidadeInput = parseLocalFloat(document.getElementById("densidade").value);
            const tipoTanque = document.getElementById("tipoTanque").value;
            const especie = document.getElementById("especieEstrutura").value;
            const fase = document.getElementById("faseEstrutura").value;
            const pesoMedioVenda = parseLocalFloat(document.getElementById("pesoMedioEstrutura").value);

            if (isNaN(comprimento) || isNaN(largura) || isNaN(profundidade) || isNaN(pesoMedioVenda)) {
                return exibirErro("Por favor, preencha Comprimento, Largura, Profundidade e Peso médio de venda.");
            }
            if (comprimento <= 0 || largura <= 0 || profundidade <= 0 || pesoMedioVenda <= 0) {
                return exibirErro("Os valores de comprimento, largura, profundidade e peso médio de venda devem ser maiores que zero.");
            }

            const area = comprimento * largura;
            const volume = area * profundidade;
            let quantidadePeixes = 0;
            let densidadeRecomendada = 0;
            let recomendacoes = "";
            let unidadeDensidade = tipoTanque === 'escavado' ? 'm²' : 'm³';

            if (dadosPiscicultura.densidadeEstocagem[tipoTanque]?.[fase]?.[especie]) {
                densidadeRecomendada = dadosPiscicultura.densidadeEstocagem[tipoTanque][fase][especie];
            } else {
                recomendacoes += `<div class="alerta-amarelo">Não há densidade recomendada para a combinação selecionada.</div>`;
            }

            const densidadeUsada = isNaN(densidadeInput) || densidadeInput <= 0 ? densidadeRecomendada : densidadeInput;

            if (densidadeUsada > 0) {
                if (tipoTanque === 'escavado') {
                    quantidadePeixes = area * densidadeUsada;
                } else {
                    quantidadePeixes = volume * densidadeUsada;
                }
            } else {
                return exibirErro("Não foi possível determinar a densidade de estocagem. Insira uma densidade ou selecione uma combinação válida.");
            }

            const biomassaEstimadaVenda = quantidadePeixes * pesoMedioVenda;

            let statusDensidade = "";
            if (!isNaN(densidadeInput) && densidadeInput > 0 && densidadeRecomendada > 0) {
                 if (densidadeInput > densidadeRecomendada * 1.2) {
                    statusDensidade = `<span class="text-red-400 font-bold">Muito Alta</span>`;
                    recomendacoes += `<div class="alerta-vermelho">Sua densidade (${formatarNumeroBR(densidadeInput)} peixes/${unidadeDensidade}) está muito acima da recomendada (${formatarNumeroBR(densidadeRecomendada)} peixes/${unidadeDensidade}). Risco de estresse e doenças.</div>`;
                } else if (densidadeInput < densidadeRecomendada * 0.8) {
                    statusDensidade = `<span class="text-yellow-400 font-bold">Baixa</span>`;
                    recomendacoes += `<div class="alerta-amarelo">Sua densidade (${formatarNumeroBR(densidadeInput)} peixes/${unidadeDensidade}) está abaixo da recomendada (${formatarNumeroBR(densidadeRecomendada)} peixes/${unidadeDensidade}). Você pode estar subutilizando seu espaço.</div>`;
                } else {
                    statusDensidade = `<span class="text-green-400 font-bold">Ideal</span>`;
                    recomendacoes += `<div class="alerta-verde">Sua densidade (${formatarNumeroBR(densidadeInput)} peixes/${unidadeDensidade}) está na faixa ideal. Bom trabalho!</div>`;
                }
            } else if (densidadeRecomendada > 0) {
                statusDensidade = `<span class="text-blue-400 font-bold">Recomendada</span>`;
                recomendacoes += `<div class="alerta-info">Utilizamos a densidade recomendada de ${formatarNumeroBR(densidadeRecomendada)} peixes/${unidadeDensidade} para ${especie} na fase de ${fase} em ${tipoTanque}.</div>`;
            }

            let recomendacoesTanque = "";
            switch (tipoTanque) {
                case 'escavado':
                    recomendacoesTanque = `<p class="mt-2"><strong>Recomendações para Tanque Escavado:</strong></p><ul class="list-disc list-inside ml-4"><li>Mantenha a qualidade da água monitorando parâmetros regularmente.</li><li>Considere aeração suplementar em altas densidades ou períodos de baixa oxigenação.</li><li>Realize a manutenção do fundo do tanque e controle de plantas aquáticas.</li><li>Proteja contra predadores (aves, mamíferos).</li></ul>`;
                    break;
                case 'rede':
                    recomendacoesTanque = `<p class="mt-2"><strong>Recomendações para Tanque-Rede:</strong></p><ul class="list-disc list-inside ml-4"><li>Verifique a integridade das redes regularmente para evitar fugas e entrada de predadores.</li><li>Limpe as redes para evitar entupimento e garantir o fluxo de água.</li><li>Monitore a correnteza e a profundidade da água no local de instalação.</li><li>Evite sobrecarga de ração para não comprometer a qualidade da água ao redor dos tanques.</li></ul>`;
                    break;
                case 'ras':
                    recomendacoesTanque = `<p class="mt-2"><strong>Recomendações para Sistema RAS:</strong></p><ul class="list-disc list-inside ml-4"><li>A manutenção rigorosa dos filtros biológicos e mecânicos é importante.</li><li>Monitore constantemente os níveis de oxigênio, amônia, nitrito e nitrato.</li><li>Garanta um bom sistema de aeração e oxigenação.</li><li>Para caso de falta de energia tenha um gerador .</li><li>Tenha areadores e bombas resevas.</li></ul>`;
                    break;
            }

            const pesoAbateIdeal = dadosPiscicultura.pesoAbateIdeal[especie];
            let recomendacaoPesoAbate = "";
            if (pesoMedioVenda < pesoAbateIdeal * 0.9) {
                recomendacaoPesoAbate = `<div class="alerta-amarelo">Seu peso médio de venda (${formatarNumeroBR(pesoMedioVenda)} kg) está abaixo do ideal para ${especie} (${formatarNumeroBR(pesoAbateIdeal)} kg).</div>`;
            } else if (pesoMedioVenda > pesoAbateIdeal * 1.1) {
                recomendacaoPesoAbate = `<div class="alerta-info">Seu peso médio de venda (${formatarNumeroBR(pesoMedioVenda)} kg) está acima do ideal para ${especie} (${formatarNumeroBR(pesoAbateIdeal)} kg). Excelente!</div>`;
            } else {
                recomendacaoPesoAbate = `<div class="alerta-verde">Seu peso médio de venda (${formatarNumeroBR(pesoMedioVenda)} kg) está na faixa ideal para ${especie} (${formatarNumeroBR(pesoAbateIdeal)} kg).</div>`;
            }

            document.getElementById("resultado").innerHTML = `
                <h3 class="text-xl font-bold text-teal-300 mb-4">📊 Resultado do Dimensionamento</h3>
                <p><strong>Área do tanque:</strong> ${formatarNumeroBR(area)} m²</p>
                <p><strong>Volume do tanque:</strong> ${formatarNumeroBR(volume)} m³</p>
                <p><strong>Densidade de estocagem usada:</strong> ${formatarNumeroBR(densidadeUsada)} peixes/${unidadeDensidade} (${statusDensidade})</p>
                <p><strong>Quantidade estimada de peixes:</strong> ${formatarNumeroBR(Math.round(quantidadePeixes), 0)} peixes</p>
                <p><strong>Biomassa estimada na venda:</strong> ${formatarNumeroBR(biomassaEstimadaVenda)} kg</p>
                <br>
                <h4 class="text-lg font-semibold text-teal-300 mb-2">Recomendações:</h4>
                ${recomendacaoPesoAbate}
                ${recomendacoes}
                ${recomendacoesTanque}
            `;
        }

        // --- CÁLCULO DE ANÁLISE DE ÁGUA ---
        function analisarAgua() {
            const especie = document.getElementById("especieAgua").value;
            const inputs = {
                temp: parseLocalFloat(document.getElementById("temperatura").value),
                ph: parseLocalFloat(document.getElementById("ph").value),
                oxi: parseLocalFloat(document.getElementById("oxigenio").value),
                alc: parseLocalFloat(document.getElementById("alcalinidade").value),
                amonia: parseLocalFloat(document.getElementById("amonia").value),
                nitrito: parseLocalFloat(document.getElementById("nitrito").value),
                nitrato: parseLocalFloat(document.getElementById("nitrato").value),
                trans: parseLocalFloat(document.getElementById("transparencia").value)
            };

            const limites = dadosPiscicultura.limitesAgua[especie];
            if (!limites) {
                return exibirErro("Parâmetros não encontrados para a espécie selecionada.");
            }

            let resultadoHTML = `<h3 class="text-xl font-bold text-teal-300 mb-4">💧 Análise da Qualidade da Água para ${limites.nome}</h3>`;
            let temProblema = false;
            let camposPreenchidos = 0;

            function verificarParametro(paramKey, valorInput) {
                if (isNaN(valorInput)) return ''; 
                camposPreenchidos++;
                const paramInfo = limites[paramKey];
                if (!paramInfo) return '';

                const [min, max] = paramInfo.range;
                let statusClass = 'alerta-verde';
                let statusTexto = 'Ideal';
                let recomendacao = '';

                if (valorInput < min) {
                    statusClass = paramKey === 'oxi' ? 'alerta-vermelho' : 'alerta-amarelo';
                    statusTexto = 'Abaixo do Ideal';
                    recomendacao = paramInfo.lowRec || '';
                    temProblema = true;
                } else if (valorInput > max) {
                    statusClass = 'alerta-vermelho';
                    statusTexto = 'Acima do Ideal';
                    recomendacao = paramInfo.highRec || '';
                    temProblema = true;
                }

                let html = `<div class="${statusClass}">`;
                html += `<strong>${paramInfo.nome}:</strong> ${formatarNumeroBR(valorInput)} ${paramInfo.unit || ''} - <strong>Status: ${statusTexto}</strong>`;
                if (recomendacao) {
                    html += `<p class="mt-2 text-sm">${recomendacao}</p>`;
                }
                html += `</div>`;
                return html;
            }

            for (const key in inputs) {
                resultadoHTML += verificarParametro(key, inputs[key]);
            }
            
            if (camposPreenchidos === 0) {
                return exibirErro("Por favor, preencha pelo menos um campo para análise.");
            }

            if (!temProblema) {
                 resultadoHTML += `<div class="alerta-verde"><strong>Parabéns!</strong> Todos os parâmetros inseridos estão dentro da faixa ideal para a criação de ${limites.nome}.</div>`;
            }

            document.getElementById("resultado").innerHTML = resultadoHTML;
        }

        // --- CÁLCULO DE RAÇÃO ---
        function calcularRacao() {
            const especie = document.getElementById("especieRacao").value;
            const fase = document.getElementById("faseRacao").value;
            const pesoMedio = parseLocalFloat(document.getElementById("pesoMedioRacao").value);
            const quantidadePeixes = parseInt(document.getElementById("quantidadePeixes").value, 10);

            if (isNaN(pesoMedio) || isNaN(quantidadePeixes)) {
                return exibirErro("Por favor, preencha o Peso Médio e a Quantidade de Peixes.");
            }
             if (pesoMedio <= 0 || quantidadePeixes <= 0) {
                return exibirErro("Os valores de peso médio e quantidade de peixes devem ser maiores que zero.");
            }

            const dadosRacao = dadosPiscicultura.racao[especie]?.[fase];
            if (!dadosRacao) {
                return exibirErro("Não há dados de ração para a combinação selecionada.");
            }

            let taxaAlimentar = 0;
            let numeroRefeicoes = 0;
            let faixaEncontrada = false;

            for (const faixa of dadosRacao.taxa) {
                const [minPeso, maxPeso, taxa, refeicoes] = faixa;
                if (pesoMedio >= minPeso && pesoMedio < maxPeso) {
                    taxaAlimentar = taxa;
                    numeroRefeicoes = refeicoes;
                    faixaEncontrada = true;
                    break;
                }
            }
            
            if (!faixaEncontrada) {
                 return exibirErro(`Não foi encontrada uma faixa de alimentação para peixes com ${formatarNumeroBR(pesoMedio)}g.`);
            }

            const biomassaTotalKg = (quantidadePeixes * pesoMedio) / 1000; // em kg
            const quantidadeRacaoDiariaKg = biomassaTotalKg * taxaAlimentar;
            const quantidadePorRefeicaoKg = quantidadeRacaoDiariaKg / numeroRefeicoes;

            document.getElementById("resultado").innerHTML = `
                <h3 class="text-xl font-bold text-teal-300 mb-4">🍲 Resultado do Cálculo de Ração</h3>
                <p><strong>Espécie:</strong> ${especie.charAt(0).toUpperCase() + especie.slice(1)}</p>
                <p><strong>Fase:</strong> ${fase.charAt(0).toUpperCase() + fase.slice(1)}</p>
                <p><strong>Biomassa Total Estimada:</strong> ${formatarNumeroBR(biomassaTotalKg)} kg</p>
                <hr class="my-3 border-gray-600">
                <div class="alerta-info">
                    <h4 class="font-bold">Recomendações de Alimentação:</h4>
                    <p><strong>Proteína Bruta (PB) recomendada:</strong> ${dadosRacao.proteina}%</p>
                    <p><strong>Tamanho do Pellet:</strong> ${dadosRacao.pellet}</p>
                    <p><strong>Taxa de alimentação diária:</strong> ${formatarNumeroBR(taxaAlimentar * 100)}% da biomassa</p>
                </div>
                <div class="alerta-verde mt-4">
                    <h4 class="font-bold">Cálculo Diário:</h4>
                    <p><strong>Quantidade total de ração por dia:</strong> ${formatarNumeroBR(quantidadeRacaoDiariaKg)} kg</p>
                    <p><strong>Número de refeições por dia:</strong> ${numeroRefeicoes}</p>
                    <p><strong>Quantidade por refeição:</strong> ${formatarNumeroBR(quantidadePorRefeicaoKg)} kg (ou ${formatarNumeroBR(quantidadePorRefeicaoKg * 1000)} g)</p>
                </div>
                <p class="mt-4 text-sm text-gray-400"><strong>Atenção:</strong> Estes valores são uma estimativa. Observe o comportamento dos peixes e a qualidade da água para ajustar a alimentação. Evite sobras de ração no viveiro.</p>
            `;
        }
        
        // --- FUNÇÕES DE COMPARTILHAMENTO ---
        function limparHtmlParaTexto(html) {
            const tempDiv = document.createElement("div");
            html = html.replace(/<\/p>/g, '\n').replace(/<\/li>/g, '\n').replace(/<br>/g, '\n').replace(/<hr[^>]*>/g, '\n---\n');
            tempDiv.innerHTML = html;
            let text = tempDiv.textContent || tempDiv.innerText || "";
            text = text.replace(/(\s\s+)/g, ' ').replace(/(\n\s*)+/g, '\n').trim();
            return text;
        }

        function compartilharWhatsApp() {
            const resultadoDiv = document.getElementById('resultado');
            if (!resultadoDiv.innerHTML.trim()) {
                alert("Primeiro, calcule um resultado para compartilhar.");
                return;
            }
            
            let textoCompartilhar = limparHtmlParaTexto(resultadoDiv.innerHTML);
            textoCompartilhar = "🐟 *Resultado da Calculadora SmartPiscis* 🐟\n\n" + textoCompartilhar;
            
            const urlWhatsApp = `https://wa.me/?text=${encodeURIComponent(textoCompartilhar)}`;
            window.open(urlWhatsApp, '_blank');
        }

        function baixarPDF() {
            const { jsPDF } = window.jspdf;
            const resultadoDiv = document.getElementById('resultado');

            if (!resultadoDiv.innerHTML.trim()) {
                alert("Primeiro, calcule um resultado para baixar.");
                return;
            }

            const doc = new jsPDF();
            const textoParaPdf = limparHtmlParaTexto(resultadoDiv.innerHTML);
            const tipoCalculoSelect = document.getElementById('tipoCalculadora');
            const tipoCalculo = tipoCalculoSelect.options[tipoCalculoSelect.selectedIndex].text;

            doc.setFontSize(18);
            doc.text(`SmartPiscis - Resultado de ${tipoCalculo}`, 14, 22);

            doc.setFontSize(11);
            const lines = doc.splitTextToSize(textoParaPdf, 180); 
            doc.text(lines, 14, 35);
            
            doc.setFontSize(8);
            doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, 14, 285);
            doc.text("Criado por Nanderson Silva - nandersonsilva7@gmail.com", 14, 290);

            doc.save(`Resultado_SmartPiscis_${tipoCalculo.replace(/ /g, '_')}.pdf`);
        }
    </script>

                    <h2 class="text-2xl font-bold text-gray-800 mb-2">1. O que é Piscicultura?</h2>
                    <p class="text-gray-600 mb-6">A arte de criar peixes de forma controlada para gerar renda e alimento.</p>
                    <div class="text-left space-y-4 mb-8 text-gray-700">
                        <img src="img/img-piscis.png" alt="Ilustração de uma criação de peixes na Amazônia" class="rounded-lg mb-4 w-full h-auto"/>
                        <p>A <strong>piscicultura</strong> é a criação de peixes em ambientes controlados, como tanques e viveiros. Diferente da pesca extrativa, onde se retira o peixe da natureza, na piscicultura nós controlamos todo o processo: a compra dos filhotes (alevinos), a alimentação, o controle da qualidade da água e a engorda até o ponto de venda (despesca).</p>
                        <p>Na Amazônia, essa atividade é uma excelente alternativa econômica e sustentável, pois reduz a pressão sobre os estoques de peixes dos rios e gera emprego e renda para as comunidades locais.</p>

                <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-lg text-center animate-fade-in">

                    <h2 class="text-2xl font-bold text-gray-800 mb-2">2. Tipos de Viveiros (Sistemas de Criação)</h2>
                    <p class="text-gray-600 mb-6">A "casa" do peixe é o primeiro passo para o sucesso.</p>
                    <div class="text-left space-y-4 mb-8 text-gray-700">
                        <img src="/img/img-viveiro.png" alt="Ilustração dos três tipos de viveiros" class="rounded-lg mb-4 w-full h-auto"/>
                        <p><strong>Viveiro Escavado:</strong> Os sistemas de criação de peixes em viveiros escavados ou em açudes,também chamados de represas, são os mais praticados no Brasil, para
criar as principais espécies de peixes. Um "lago" artificial cavado em solo argiloso para não vazar água, não é recomendado para solo arenoso.
<strong>Vantagem:</strong> Menor custo inicial, ambiente mais natural. <strong>Desvantagem:</strong> Exige mais espaço, mais difícil controlar predadores.</p>
                        <p><strong>Tanque-Rede:</strong> São "gaiolas" flutuantes instaladas em rios, lagos ou açudes grandes.Neste sistema de criação, a qualidade da água é mantida pela sua livre e
contínua circulação entre o tanque-rede e o ambiente. Por isso, é fundamental que a instalação seja feita em locais com boa qualidade de água ao longo de todo o ano, e que as telas e flutuadores sejam mantidos em
ótimas condições de limpeza e funcionamento. <strong>Vantagem:</strong> Aproveita corpos d'água existentes. <strong>Desvantagem:</strong> Exige licença ambiental, risco de fugas e roubos, dependente da qualidade da água do local.</p>
                        <p><strong>Tanque Circular:</strong> Feito de cimento, ferro ou geomembrana.É um tanque, geralmente circular ou retangular, onde a água é constantemente renovada e movimentada, criando um ambiente propício para o crescimento dos peixes. A circulação da água ajuda a distribuir nutrientes e oxigênio de forma mais homogênea, além de facilitar a remoção de resíduos é uma criação intensiva. 
                            <strong>Vantagem:</strong> Alto controle da produção, maior produtividade. A circulação constante garante que os peixes tenham acesso a alimento e oxigênio de maneira uniforme. <strong>Desvantagem:</strong> Alto custo com equipamentos (bombas, filtros) e energia elétrica.</p>
                        <p><strong>Canal de Igarapé:</strong> Um viveiro de canal de igarapé é uma técnica de piscicultura que utiliza o leito de um igarapé como espaço para a criação de peixes, como a matrinxã. Essa prática adapta o conceito de "raceway" ou fluxo contínuo, utilizando o canal do igarapé em vez de tanques de concreto. O sistema aproveita os recursos naturais da água e solo da região, sendo uma alternativa para a produção aquícola em áreas rurais
                             <strong>Vantagem:</strong> Reduz o impacto ambiental ao utilizar os recursos naturais do igarapé,diminui os custos de produção ao aproveitar o ambiente natural para a criação e permite a produção de peixes em áreas rurais, onde há igarapés disponíveis.
                             <strong>Desvantagem:</strong> riscos ambientais, como a possibilidade de contaminação da água e do solo, além de problemas de manejo devido à dificuldade de controle da qualidade da água e da temperatura, e riscos de escape de peixes para o ambiente natural.</p>

                    </div>
                </div>`,
            curso_especiesAmazonas: `
                <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-lg text-center animate-fade-in">
                    <svg class="w-20 h-20 mx-auto text-blue-500 mb-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 6H3.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12H3.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 18H3.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">3. Espécies para Criar no Amazonas</h2>
                    <p class="text-gray-600 mb-6">Conheça os campeões de crescimento e mercado da nossa região.</p>
                    <div class="text-left space-y-4 mb-8 text-gray-700">
                        <img src="img/img-tamb.png" alt="Ilustração de Tambaqui, Matrinxã e Pirarucu" class="rounded-lg mb-4 w-full h-auto"/>
                        <div class="bg-yellow-50 p-3 rounded-lg border-l-4 border-yellow-400">
                            <h3 class="font-bold text-yellow-800">Tambaqui (Recomendado para iniciantes)</h3>
                            <p>É o rei da piscicultura amazônica. Rústico, resistente, cresce rápido e tem um mercado excelente, tanto na feira quanto para restaurantes. É onívoro, ou seja, come de tudo, adaptando-se muito bem à ração e aceitando frutos da região (como açaí e buriti) para complementar a dieta.</p>
                        </div>
                        <div class="bg-gray-100 p-3 rounded-lg mt-4 border-l-4 border-gray-400">
                            <h3 class="font-bold text-gray-800">Matrinxã</h3>
                            <p>Outra ótima opção. É um peixe muito ativo e de carne saborosa e valorizada. Também se adapta bem ao cativeiro e à ração, apresentando bom crescimento. Exige água de boa qualidade e bem oxigenada.</p>
                        </div>
                        <div class="bg-red-50 p-3 rounded-lg mt-4 border-l-4 border-red-400">
                            <h3 class="font-bold text-red-800">Pirarucu (Criação avançada)</h3>
                            <p>É o sonho de todo piscicultor pelo seu tamanho e alto valor de mercado. No entanto, é para produtores experientes. É carnívoro (exige ração específica e mais cara), precisa de licença ambiental rigorosa do IPAAM e um manejo muito mais cuidadoso.</p>

                        <button onclick="mostrarPasso('curso_dimensionamento')" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition-colors">Próximo Passo</button>

            curso_dimensionamento: `
                <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-lg text-center animate-fade-in">
                    <svg class="w-20 h-20 mx-auto text-blue-500 mb-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="2"/><rect x="8" y="6" width="8" height="4" rx="1" stroke="currentColor" stroke-width="2"/><line x1="8" y1="14" x2="10" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="14" y1="14" x2="16" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="18" x2="10" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="14" y1="18" x2="16" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">4. Dimensionamento do Viveiro</h2>
                    <p class="text-gray-600 mb-6">Planejando o tamanho ideal para começar sem erros.</p>
                    <div class="text-left space-y-4 mb-8 text-gray-700">
                        <img src="img/img-dime2.png" alt="Ilustração do cálculo de área de um viveiro" class="rounded-lg mb-4 w-full h-auto"/>
                        <p><strong>Regra de Ouro: Comece pequeno!</strong> É melhor ter sucesso em um viveiro de 200 m² do que fracassar em um de 1.000 m².</p>
                        <p><strong>Densidade de Povoamento:</strong> É a quantidade de peixes por metro quadrado (m²) ou metro cúbico ( m³).
                             Na região se utiliza em média 0,5 a 0,6 kg de peixe por m² quando criamos em viveiros escavados sem aeração. 
                             Quando o produtor utiliza aeração essa densidade poderá aumentar para 1 kg de peixe por metros quadrados (m²).
                              Nos sistemas de recirculação, tanques rede ou canais de igarapé, a densidade de estocagem é calculada em  kg por metro cúbico (m³).
                              Em tanques rede na região de Itacoatiara o produtor utiliza a densidade de estocagem de aproximadamente 30 kg/m³.
                               Nos sistemas de recirculação do IFAM campus Itacoatiara experimentos demonstraram que densidades de criação de 25 a 30 kg por metro cúbico (m³) foram adequadas para produção de tambaqui curumim.
                                Produtores de matrinxã em canais de igarapé utilizam densidades de 15 a 20 kg/m³. Controlar a densidade de estocagem é importante para a saúde dos seus peixes e a produtividade da sua criação
</p>
                        <p><strong>Exemplo Prático:</strong>
                            <li>Viveiro escavado: 10m de largura x 20m de comprimento = <strong>200 m²</strong>.</li>
                            <li>Densidade: 1 peixe/m².</li>
                            <li>Cálculo: 200 m² x 1 peixe/m² = <strong>200 peixes (alevinos)</strong>.</li>
                        </p>
                        <p><strong>Profundidade:</strong> A profundidade ideal do viveiro deve variar. Uma parte mais rasa (cerca de 1,20m) e uma mais funda (cerca de 1,80m). Isso cria zonas de conforto térmico para os peixes.</p>
                        <p><strong>Calculadora SmartPiscis:</strong> Ultilize a calculadora SmartPiscis ela permite estimar o dimensionamento do viveiro, densidade de estocagem com base em parâmetros zootécnicos específicos. Preencha os campos para obter resultados precisos
</p>

            curso_qualidadeAgua: `
                <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-lg text-center animate-fade-in">
                    <svg class="w-20 h-20 mx-auto text-blue-500 mb-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M9.09 9.00001C9.3251 8.33168 9.78915 7.76811 10.4 7.40914C11.0108 7.05018 11.7289 6.91894 12.4272 7.03871C13.1255 7.15849 13.7588 7.52153 14.2151 8.06354C14.6714 8.60555 14.9211 9.29152 14.92 10C14.92 12 11.92 13 11.92 13V14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">5. Qualidade da Água: O Segredo do Sucesso</h2>
                    <p class="text-gray-600 mb-6">A água não é só onde o peixe vive, é o que o mantém saudável.</p>
                    <div class="text-left space-y-4 mb-8 text-gray-700">
                        <img src="img/img-qalidade.png" alt="Ilustração dos parâmetros de qualidade da água" class="rounded-lg mb-4 w-full h-auto"/>
                        <p><strong>Oxigênio Dissolvido:</strong> É o ar que o peixe respira. A principal causa de mortalidade é a falta de oxigênio. <strong>Sinal de perigo:</strong> peixes na superfície "boiando" ou "abrindo a boca". <strong>Solução:</strong> Renove a água do viveiro constantemente ou use aeradores (equipamento que borbulha ar na água).</p>
                        <p><strong>pH (Acidez):</strong> O ideal para peixes amazônicos é um pH entre 5.5 e 8.5. Solos da nossa região costumam ser ácidos. <strong>Solução:</strong> Fazer a <strong>calagem</strong>, que é a aplicação de calcário no fundo do viveiro (antes de encher) para neutralizar a acidez.Lembre-se de monitorar o pH semanalmente.</p>

                        <p><strong>Ração:</strong> É o maior custo da produção (até 70% do total). Use ração extrusada (flutuante) de boa qualidade. A quantidade de proteína na ração varia com a idade do peixe (mais proteína para os jovens). Ofereça de 2 a 3 vezes ao dia, em quantidade que seja consumida em no máximo 15 minutos. <strong>Ração que sobra vira amônia!</strong></p>
                        <p><strong>Biometria:</strong> É a "consulta médica" dos seus peixes. Uma vez por mês, use uma rede (tarrafa) para capturar uma amostra (uns 20 peixes) e pese-os em um balde com água numa balança.
